<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>答辩演示</title>
  <style>
    :root{--ink:#17212b;--paper:#f6f4ef;--white:#fff;--teal:#087f78;--yellow:#f4c95d;--red:#b9423e;--line:#c9cec9;--muted:#5b6670}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#20272e;color:var(--ink);font-family:"Microsoft YaHei UI","Noto Sans SC",sans-serif;letter-spacing:0}.app{height:100%;display:grid;grid-template-rows:50px 1fr 30px}.toolbar,.footer{display:flex;align-items:center;gap:10px;padding:0 16px;background:#17212b;color:#fff}.toolbar strong{font-size:15px}.toolbar .spacer{flex:1}.toolbar button{width:38px;height:34px;border:1px solid #68737c;background:transparent;color:#fff;border-radius:4px;font-size:18px;cursor:pointer}.toolbar button:hover{background:var(--teal)}.viewport{position:relative;overflow:hidden}.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;background:var(--paper);transform-origin:center;box-shadow:0 20px 70px #0008}.slide{position:absolute;inset:0;display:none;width:1600px;height:900px;padding:70px 82px 58px;background:var(--paper);overflow:hidden}.slide.active{display:flex;flex-direction:column}.slide::after{content:attr(data-page);position:absolute;right:36px;bottom:24px;color:#69737b;font-size:16px}.cover{padding:0;color:#fff;justify-content:flex-end}.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover-shade{position:absolute;inset:0;background:#111a22aa}.cover-copy{position:relative;padding:80px 88px 100px;max-width:1250px}.eyebrow{font-size:21px;font-weight:800;color:var(--teal);margin-bottom:14px}.cover .eyebrow{color:var(--yellow)}h1{font-size:72px;line-height:1.15;margin:0 0 28px;max-width:1250px}h2{font-size:48px;line-height:1.2;margin:0 0 30px;max-width:1380px}.subtitle{font-size:29px;line-height:1.55;max-width:1100px}.student{margin-top:50px;font-size:24px}.content{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.9fr);gap:42px;min-height:0;flex:1}.content.no-media{grid-template-columns:1fr}.copy{font-size:25px;line-height:1.55;min-width:0}.summary{font-size:29px;line-height:1.5;margin-bottom:22px}.bullets{list-style:none;padding:0;margin:0;display:grid;gap:14px}.bullets li{position:relative;padding-left:28px}.bullets li::before{content:"";position:absolute;left:0;top:.58em;width:12px;height:12px;background:var(--yellow)}.media{display:grid;gap:14px;min-height:0;align-content:center}.media.count-1{grid-template-columns:1fr}.media.count-2{grid-template-columns:repeat(2,minmax(0,1fr))}.media.count-3,.media.count-4{grid-template-columns:repeat(2,minmax(0,1fr))}.frame{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);min-height:0;margin:0;overflow:hidden}.frame img,.frame video{display:block;width:100%;height:100%;min-height:0;max-height:560px;object-fit:contain;background:#fff}.frame video{background:#101820}.count-2 .frame img,.count-2 .frame video,.count-3 .frame img,.count-3 .frame video,.count-4 .frame img,.count-4 .frame video{max-height:260px}.caption{padding:9px 12px;font-size:15px;color:var(--muted);border-top:1px solid var(--line)}.caption.generated{color:#066a64;font-weight:700}.caption.video{color:#0b5f7a;font-weight:700}.missing{height:240px;border:3px dashed var(--red);background:#fff7f2;display:flex;flex-direction:column;justify-content:center;padding:28px}.missing strong{font-size:28px;color:var(--red);margin-bottom:12px}.missing span{font-size:20px;line-height:1.5}.solutions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:10px}.solution{background:#fff;border-top:7px solid var(--teal);padding:22px;min-height:250px}.solution h3{font-size:23px;margin:0 0 15px}.solution p{font-size:18px;line-height:1.45;margin:8px 0}.solution b{color:var(--red)}.chain{margin-top:auto;display:flex;align-items:center;gap:10px;padding:18px 20px;background:#fff;border-left:8px solid var(--teal);font-size:19px}.chain span{color:var(--teal);font-weight:800}.notes{position:fixed;right:20px;top:64px;width:min(500px,44vw);max-height:calc(100vh - 100px);overflow:auto;background:#fff;border:2px solid var(--teal);padding:20px;display:none;z-index:20;box-shadow:0 18px 50px #0007}.notes.open{display:block}.notes h3{margin:0 0 10px}.notes p{font-size:17px;line-height:1.65;white-space:pre-wrap}.progress{height:4px;background:var(--yellow);width:0}.footer span{margin-left:auto;font-size:12px;color:#dfe5e8}@media(max-width:800px){.toolbar .label,.footer span{display:none}.notes{left:12px;right:12px;width:auto}}
  </style>
  <style>
    .slide:not(.cover){background:#fbfaf7;padding-top:58px}.slide.title-long h2{font-size:42px}.slide.title-xlong h2{font-size:36px}.slide:not(.cover) .eyebrow{padding-left:12px;border-left:7px solid #9ccf65;color:#173846}.slide:not(.cover) h2{margin-bottom:24px}.copy{font-size:23px}.summary{font-size:26px}.bullets{gap:12px}.bullets li.parameter{padding:9px 14px 9px 22px;background:#eef3f5;border-left:5px solid var(--teal);font:700 20px/1.4 Consolas,"Microsoft YaHei UI",sans-serif}.bullets li.parameter::before{display:none}.slide.solution .content:not(.missing-only){grid-template-columns:minmax(0,.82fr) minmax(520px,1.18fr)}.slide.solution .content:not(.missing-only) .frame img{max-height:520px}.content.missing-only{grid-template-columns:1fr;grid-template-rows:auto minmax(190px,1fr);gap:20px}.content.missing-only .copy{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:30px;align-items:start}.content.missing-only .summary{margin:0}.content.missing-only .media{align-content:stretch}.content.missing-only .missing{height:100%;min-height:190px}.goal-layout{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:28px;min-height:0;flex:1}.goal-focus,.goal-functions{padding:30px 34px}.goal-focus{display:flex;flex-direction:column;justify-content:center;background:#f7e1d5;border-left:9px solid var(--red)}.goal-focus span,.goal-functions>span,.summary-result>span,.summary-next>span{display:block;margin-bottom:14px;color:var(--muted);font-size:18px;font-weight:800}.goal-focus strong{font-size:32px;line-height:1.45}.goal-focus p{margin:20px 0 0;font-size:21px;line-height:1.5}.goal-functions{background:#e6f1dd;border-left:9px solid #6ba24a}.goal-functions .bullets{gap:15px}.goal-functions .bullets li{font-size:23px}.current-state .summary{font-size:23px;line-height:1.4;margin-bottom:16px}.current-state-compare{display:grid;grid-template-columns:minmax(430px,.82fr) minmax(0,1.18fr);gap:24px;min-height:0;flex:1}.current-state-compare>.media{align-content:stretch}.current-state-compare>.media .frame img{height:470px;max-height:470px;object-fit:contain}.solution-stack{display:grid;gap:11px}.solution{min-height:0;padding:17px 19px;border-top:0;border-left:7px solid var(--teal)}.solution h3{margin:0 0 7px;font-size:21px}.solution p{margin:4px 0;font-size:16px;line-height:1.35}.solution .response{color:#176b54;font-weight:800}.solutions.with-images{margin:0;align-items:stretch}.solutions.with-images .solution{padding:0 16px 15px;border-left:0;border-top:7px solid var(--teal)}.solution-media{margin:0 -16px 12px}.solution-media .frame{border:0}.solution-media .frame img{height:142px;max-height:142px;object-fit:cover}.solution-media .caption{font-size:12px;padding:5px 8px}.summary-layout{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:28px;min-height:0;flex:1}.summary-result{display:flex;flex-direction:column;justify-content:center;padding:32px;background:#deebf6;border-left:9px solid #4b88bc}.summary-result strong{font-size:29px;line-height:1.45}.summary-result p{font-size:21px;line-height:1.5}.summary-details{display:flex;flex-direction:column;gap:18px}.summary-points{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.summary-point{padding:18px 20px;background:#e6f1dd;border-top:6px solid #6ba24a;font-size:21px;line-height:1.45}.summary-next{margin-top:auto;padding:20px 24px;background:#edf0f8;border-left:8px solid #6e79b6;font-size:21px;line-height:1.45}.notes{border-color:#6ba24a}@media(max-width:800px){.goal-layout,.summary-layout,.current-state-compare{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <script id="defense-data" type="application/json">__DEFENSE_DATA__</script>
  <div class="app">
    <header class="toolbar"><strong class="label" id="label">答辩演示</strong><span class="spacer"></span><button id="notes-button" title="查看本页参考稿">N</button><button id="fullscreen-button" title="全屏">⛶</button></header>
    <main class="viewport" id="viewport"><div class="stage" id="stage"></div></main>
    <footer class="footer"><div class="progress" id="progress"></div><span>← → 翻页　N 参考稿　F 全屏</span></footer>
  </div>
  <aside class="notes" id="notes"><h3 id="notes-title"></h3><p id="notes-body"></p></aside>
  <script>
  (()=>{
    const spec=JSON.parse(document.getElementById('defense-data').textContent);const stage=document.getElementById('stage');const viewport=document.getElementById('viewport');const panel=document.getElementById('notes');let current=0;
    const sectionNames={problem:'问题由来','current-state':'现有方案','research':'调研发现',goal:'核心目标',solution:'方案设计',principle:'技术原理',diagrams:'图纸逻辑',making:'制作过程',prototype:'项目原型',experiment:'实验验证',summary:'总结与创新'};
    spec.slides.forEach(slide=>{if(!slide.kicker)slide.kicker=sectionNames[slide.section]||slide.section});
    const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node};
    const cleanCaption=value=>String(value||'').replace(/^AI生成(?:示意图)?\s*[·|｜:：-]?\s*/,'').trim();
    function bulletList(values=[]){const list=el('ul','bullets');values.forEach(value=>{const item=el('li','',value);if(/(?:[A-Z][A-Z0-9_]{2,}\s*=)|(?:d[XYZ]\s*[≈=])/i.test(value))item.classList.add('parameter');list.append(item)});return list}
    function media(images=[],videos=[]){const items=[...images.map(item=>({...item,kind:'image'})),...videos.map(item=>({...item,kind:'video'}))];const box=el('div',`media count-${Math.min(items.length,4)}`);items.forEach(item=>{if(item.status==='missing'){const missing=el('div','missing');missing.append(el('strong','',`待补：${item.label}`));missing.append(el('span','',`${item.needed}｜请${item.requested_from}补充`));box.append(missing);return}if(item.status==='not-applicable')return;const frame=el('figure','frame');if(item.kind==='video'){const player=el('video');player.src=item.src;player.controls=true;player.preload='metadata';player.playsInline=true;player.setAttribute('aria-label',item.label||'学生演示视频');frame.append(player)}else{const img=el('img');img.src=item.src;img.alt=item.label||'';frame.append(img)}const captionText=cleanCaption(item.caption||item.label);if(captionText||item.kind==='video')frame.append(el('figcaption',`caption ${item.kind==='video'?'video':''}`,`${captionText}${item.kind==='video'?'｜点击播放学生演示':''}`));box.append(frame)});return box}
    function solutionCard(item,image){const card=el('article','solution');if(image){const visual=media([image]);visual.classList.add('solution-media');card.append(visual)}card.append(el('h3','',item.name));if(item.solution)card.append(el('p','',item.solution));card.append(el('p','',`优点：${item.strength}`));const limitation=el('p');limitation.append(el('b','','不足：'));limitation.append(document.createTextNode(item.limitation));card.append(limitation);card.append(el('p','response',`本项目回应：${item.project_advantage}`));return card}
    function renderCurrentState(root,slide){const solutions=(spec.existing_solutions||[]).slice(0,3);const images=(slide.images||[]).filter(item=>['present','generated'].includes(item.status));if(slide.summary)root.append(el('div','summary',slide.summary));if(images.length===1){const layout=el('div','current-state-compare');layout.append(media(images));const stack=el('div','solution-stack');solutions.forEach(item=>stack.append(solutionCard(item)));layout.append(stack);root.append(layout);return}const grid=el('div',`solutions ${images.length>1?'with-images':''}`);solutions.forEach((item,index)=>grid.append(solutionCard(item,images[index])));root.append(grid)}
    function renderGoal(root,slide){const values=slide.bullets||[];const goal=values[0]||slide.summary||spec.meta.core_problem;const functions=values.slice(1);const layout=el('div','goal-layout');const focus=el('section','goal-focus');focus.append(el('span','','核心目标'));focus.append(el('strong','',goal));if(slide.summary&&slide.summary!==goal)focus.append(el('p','',slide.summary));layout.append(focus);const features=el('section','goal-functions');features.append(el('span','','关键功能'));features.append(bulletList(functions));layout.append(features);root.append(layout)}
    function renderSummary(root,slide){const values=slide.bullets||[];const futureIndex=values.findIndex(value=>/下一步|未来|限制|改进/.test(value));const future=futureIndex>=0?values[futureIndex]:'';const points=values.filter((_,index)=>index!==0&&index!==futureIndex);const layout=el('div','summary-layout');const result=el('section','summary-result');result.append(el('span','','核心成果'));result.append(el('strong','',values[0]||slide.summary||slide.title));if(slide.summary&&slide.summary!==values[0])result.append(el('p','',slide.summary));layout.append(result);const details=el('section','summary-details');const grid=el('div','summary-points');points.slice(0,4).forEach(value=>grid.append(el('div','summary-point',value)));details.append(grid);if(future){const next=el('div','summary-next');next.append(el('span','','下一步'));next.append(document.createTextNode(future));details.append(next)}layout.append(details);root.append(layout)}
    function render(slide,index){const titleLength=(slide.title||'').length;const classes=['slide',slide.section];if(slide.section==='cover')classes.push('cover');if(titleLength>38)classes.push('title-xlong');else if(titleLength>30)classes.push('title-long');const root=el('section',classes.join(' '));root.dataset.page=`${index+1} / ${spec.slides.length}`;root.dataset.notes=[slide.notes,slide.transition?`过渡：${slide.transition}`:''].filter(Boolean).join('\n\n');if(slide.section==='cover'){const image=(slide.images||[]).find(item=>item.status!=='missing'&&item.status!=='not-applicable');if(image){const bg=el('img','cover-bg');bg.src=image.src;bg.alt=image.label||'';root.append(bg)}root.append(el('div','cover-shade'));const copy=el('div','cover-copy');copy.append(el('div','eyebrow','项目答辩'));copy.append(el('h1','',slide.title));const summaryHasStudent=(slide.summary||'').includes(spec.meta.student_name);if(slide.summary&&!summaryHasStudent)copy.append(el('div','subtitle',slide.summary));copy.append(el('div','student',summaryHasStudent?slide.summary:`${spec.meta.student_name}｜${spec.meta.project_short_name}`));root.append(copy);return root}root.append(el('div','eyebrow',slide.kicker||slide.section));root.append(el('h2','',slide.title));if(slide.section==='current-state'){renderCurrentState(root,slide);return root}if(slide.section==='goal'){renderGoal(root,slide);return root}if(slide.section==='summary'){renderSummary(root,slide);return root}const images=(slide.images||[]).filter(item=>item.status!=='not-applicable');const videos=(slide.videos||[]).filter(item=>item.status!=='not-applicable');const items=[...images,...videos];const mediaCount=items.length;const missingOnly=mediaCount>0&&items.every(item=>item.status==='missing');const grid=el('div',`content ${mediaCount?'':'no-media'} ${missingOnly?'missing-only':''}`);const copy=el('div','copy');if(slide.summary)copy.append(el('div','summary',slide.summary));copy.append(bulletList(slide.bullets||[]));grid.append(copy);if(mediaCount)grid.append(media(images,videos));root.append(grid);return root}
    spec.slides.forEach((slide,index)=>stage.append(render(slide,index)));
    const slides=[...stage.querySelectorAll('.slide')];
    function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(viewport.clientWidth/1600,viewport.clientHeight/900)})`}
    function go(index){current=Math.max(0,Math.min(index,slides.length-1));slides.forEach((slide,i)=>slide.classList.toggle('active',i===current));document.getElementById('progress').style.width=`${((current+1)/slides.length)*100}%`;document.getElementById('notes-title').textContent=`第${current+1}页｜${spec.slides[current].title}`;document.getElementById('notes-body').textContent=spec.slides[current].notes||''}
    document.getElementById('label').textContent=`${spec.meta.student_name}-${spec.meta.project_short_name}`;document.title=`${spec.meta.student_name}-${spec.meta.project_short_name}-答辩演示`;document.getElementById('notes-button').onclick=()=>panel.classList.toggle('open');document.getElementById('fullscreen-button').onclick=()=>document.documentElement.requestFullscreen?.();window.addEventListener('resize',fit);window.addEventListener('keydown',event=>{if(event.target instanceof HTMLMediaElement)return;if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();go(current-1)}else if(event.key.toLowerCase()==='n')panel.classList.toggle('open');else if(event.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});fit();go(0);window.__defenseReady=true;
  })();
  </script>
</body>
</html>
