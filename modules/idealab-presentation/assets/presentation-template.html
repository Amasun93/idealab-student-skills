<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>答辩演示</title>
  <style>
    :root{--ink:#202326;--paper:#fff;--green:#a8d36a;--red:#e52520;--blue:#5d9bd3;--peach:#fae4d6;--pale-green:#e6f2dc;--pale-blue:#dce8f6;--line:#c8ced1;--muted:#616a70}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#20272e;color:var(--ink);font-family:"Microsoft YaHei","Microsoft YaHei UI","Noto Sans SC",sans-serif;letter-spacing:0}.app{height:100%;display:grid;grid-template-rows:50px 1fr 30px}.toolbar,.footer{display:flex;align-items:center;gap:10px;padding:0 16px;background:#17212b;color:#fff}.toolbar strong{font-size:15px}.toolbar .spacer{flex:1}.toolbar button{width:38px;height:34px;border:1px solid #68737c;background:transparent;color:#fff;border-radius:4px;font-size:18px;cursor:pointer}.toolbar button:hover{background:#477b35}.viewport{position:relative;overflow:hidden}.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;background:var(--paper);transform-origin:center;box-shadow:0 20px 70px #0008}.slide{position:absolute;inset:0;display:none;width:1600px;height:900px;padding:42px 58px 48px;background:var(--paper);overflow:hidden}.slide.active{display:flex;flex-direction:column}.slide::after{content:attr(data-page);position:absolute;right:28px;bottom:18px;color:#6d7478;font-size:14px}.cover{padding:0;color:#fff;justify-content:flex-end}.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover-shade{position:absolute;inset:0;background:#111a22aa}.cover-copy{position:relative;padding:80px 88px 100px;max-width:1250px}.eyebrow{font-size:21px;font-weight:800;color:#f4c95d;margin-bottom:14px}h1{font-size:72px;line-height:1.15;margin:0 0 28px;max-width:1250px}.subtitle{font-size:29px;line-height:1.55;max-width:1100px}.student{margin-top:50px;font-size:24px}
    .template-header{position:relative;display:flex;align-items:baseline;gap:12px;margin:0 0 20px;padding-left:18px;font-size:40px;line-height:1.18;font-weight:900}.template-header::before{content:"";position:absolute;left:0;top:3px;width:8px;height:42px;background:var(--green)}.template-prefix{color:#111}.template-topic{color:var(--red)}.template-thesis{margin:-2px 0 18px;font-size:24px;line-height:1.45;font-weight:700}.template-conclusion{margin-top:14px;color:var(--red);font-size:22px;line-height:1.4;font-weight:900;text-align:right}.summary{font-size:23px;line-height:1.48;margin-bottom:16px}.copy{font-size:22px;line-height:1.5;min-width:0}.bullets{list-style:none;padding:0;margin:0;display:grid;gap:12px}.bullets li{position:relative;padding-left:27px}.bullets li::before{content:"";position:absolute;left:2px;top:.58em;width:9px;height:9px;border-radius:50%;background:#34383b}.bullets li.parameter{padding:8px 13px 8px 20px;background:#eef3f5;border-left:5px solid #4f9390;font:700 18px/1.4 Consolas,"Microsoft YaHei",sans-serif}.bullets li.parameter::before{display:none}
    .frame{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);min-height:0;margin:0;overflow:hidden}.frame img,.frame video{display:block;width:100%;height:100%;min-height:0;object-fit:contain;background:#fff}.frame video{background:#101820}.caption{padding:7px 10px;font-size:14px;line-height:1.35;color:var(--muted);border-top:1px solid var(--line)}.caption.video{color:#155f78;font-weight:700}.missing{display:flex;flex-direction:column;justify-content:center;height:100%;min-height:130px;padding:22px;border:2px dashed #dd5b54;background:#fff7f2}.missing strong{margin-bottom:9px;color:#c83d37;font-size:23px}.missing span{font-size:17px;line-height:1.45}
    .problem-scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;height:330px}.problem-scenes .frame img{height:285px}.problem-bottom{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:34px;margin-top:18px;min-height:0;flex:1}.problem-bottom .summary{font-size:21px}.problem-bottom .template-conclusion{align-self:end}.research-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;min-height:0;flex:1}.research-grid .frame img{height:205px}
    .current-state-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;min-height:0;flex:1}.current-solution{display:flex;flex-direction:column;min-width:0}.current-solution .frame{height:250px}.current-solution .frame img{height:205px}.current-solution h3{margin:12px 0 7px;font-size:22px}.current-solution p{margin:3px 0;font-size:17px;line-height:1.38}.current-solution b{color:var(--red)}
    .goal-statement{display:flex;align-items:baseline;gap:14px;margin:0 0 20px;color:var(--red);font-size:27px;line-height:1.35;font-weight:900}.goal-statement strong{font-size:31px}.goal-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;min-height:0;flex:1}.goal-panel{display:flex;flex-direction:column;min-height:0;padding:24px 32px 28px}.goal-focus{background:var(--peach)}.goal-functions{background:var(--pale-green)}.goal-panel-title{margin:0 0 12px;color:#3f4142;font-size:38px;line-height:1.2;font-weight:900}.goal-items{display:grid;grid-template-rows:repeat(var(--pair-count),minmax(0,1fr));min-height:0;flex:1}.goal-item{position:relative;display:flex;align-items:center;padding:7px 6px 7px 32px;color:#404446;font-size:23px;line-height:1.4}.goal-item::before{content:"";position:absolute;left:4px;top:50%;width:9px;height:9px;background:#424546;border-radius:50%;transform:translateY(-50%)}
    .principle-layout{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:30px;min-height:0;flex:1}.principle-media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;min-height:0}.principle-media .frame img{height:405px}.solution-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(390px,.85fr);gap:24px;min-height:0;flex:1}.solution-concept,.solution-side{min-height:0}.solution-concept .frame{height:100%}.solution-concept .frame img{height:505px}.solution-side{display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:18px}.solution-side .frame img{height:212px}
    .making-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;min-height:0;flex:1}.making-grid .frame img{height:245px}.making-grid.missing-only{display:block}.making-grid.missing-only .missing{height:100%}.prototype-hero{min-height:0;flex:1}.prototype-hero .frame{height:100%;max-width:1360px;margin:0 auto}.prototype-hero .frame img,.prototype-hero .frame video{height:610px}
    .experiment-overview{font-size:23px;line-height:1.5}.experiment-overview .summary{font-size:27px;font-weight:700}.experiment-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-bottom:18px;font-size:18px;line-height:1.45}.experiment-meta strong{display:block;margin-bottom:6px;font-size:20px}.experiment-media{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:22px;min-height:0;flex:1}.experiment-media .frame img{height:405px}.experiment-result{margin-top:12px;color:var(--red);font-size:23px;line-height:1.4;font-weight:900}
    .summary-layout{display:grid;grid-template-columns:minmax(340px,.42fr) minmax(0,.58fr);gap:22px;min-height:0;flex:1}.summary-evidence .frame{height:100%}.summary-evidence .frame img{height:600px}.summary-details{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,.7fr);gap:18px}.summary-block{padding:22px 26px;background:var(--pale-green)}.summary-block.future{background:var(--pale-blue)}.summary-block h3{margin:0 0 10px;font-size:29px}.summary-block .bullets{font-size:20px}
    .generic-content{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:30px;min-height:0;flex:1}.generic-media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;min-height:0}.notes{position:fixed;right:20px;top:64px;width:min(500px,44vw);max-height:calc(100vh - 100px);overflow:auto;background:#fff;border:2px solid var(--green);padding:20px;display:none;z-index:20;box-shadow:0 18px 50px #0007}.notes.open{display:block}.notes h3{margin:0 0 10px}.notes p{font-size:17px;line-height:1.65;white-space:pre-wrap}.progress{height:4px;background:var(--green);width:0}.footer span{margin-left:auto;font-size:12px;color:#dfe5e8}@media(max-width:800px){.toolbar .label,.footer span{display:none}.notes{left:12px;right:12px;width:auto}}
  </style>
</head>
<body>
  <script id="defense-data" type="application/json">__DEFENSE_DATA__</script>
  <div class="app">
    <header class="toolbar"><strong class="label" id="label">答辩演示</strong><span class="spacer"></span><button id="notes-button" title="查看本页参考稿">N</button><button id="fullscreen-button" title="全屏">⛶</button></header>
    <main class="viewport" id="viewport"><div class="stage" id="stage"></div></main>
    <footer class="footer"><div class="progress" id="progress"></div><span>← → 翻页　N 参考稿　F 全屏</span></footer>
  </div>
  <aside class="notes" id="notes"><h3 id="notes-title"></h3><p id="notes-body"></p></aside>
  <script>
  (()=>{
    const spec=JSON.parse(document.getElementById('defense-data').textContent);
    const stage=document.getElementById('stage');
    const viewport=document.getElementById('viewport');
    const panel=document.getElementById('notes');
    let current=0;
    const headings={
      problem:['','问题由来'],research:['背景综述：','调研访谈'],'current-state':['背景综述：','现有解决方案分析'],goal:['背景综述：','核心目标与功能'],principle:['方法与过程：','技术原理'],diagrams:['方法与过程：','解决方案'],solution:['方法与过程：','解决方案'],making:['方法与过程：','实现过程'],prototype:['方法与过程：','原型成品'],summary:['','课题总结']
    };
    const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node};
    const cleanCaption=value=>String(value||'').replace(/^AI生成(?:示意图)?\s*[·|｜:：-]?\s*/,'').trim();
    const visible=items=>(items||[]).filter(item=>item.status!=='not-applicable');
    function bulletList(values=[]){const list=el('ul','bullets');values.forEach(value=>{const item=el('li','',value);if(/(?:[A-Z][A-Z0-9_]{2,}\s*=)|(?:d[XYZ]\s*[≈=])/i.test(value))item.classList.add('parameter');list.append(item)});return list}
    function mediaItem(item,kind='image'){
      if(!item)return el('div','missing','缺少模板要求的素材位置');
      if(item.status==='missing'){
        const missing=el('div','missing');
        missing.append(el('strong','',`待补：${item.label}`));
        missing.append(el('span','',[item.needed,item.requested_from?`请${item.requested_from}补充`:null].filter(Boolean).join('｜')));
        return missing;
      }
      const frame=el('figure','frame');
      if(kind==='video'){
        const player=el('video');player.src=item.src;player.controls=true;player.preload='metadata';player.playsInline=true;player.setAttribute('aria-label',item.label||'学生演示视频');frame.append(player);
      }else{
        const image=el('img');image.src=item.src;image.alt=item.label||'';frame.append(image);
      }
      const caption=cleanCaption(item.caption||item.label);
      if(caption||kind==='video')frame.append(el('figcaption',`caption ${kind==='video'?'video':''}`,`${caption}${kind==='video'?'｜点击播放学生演示':''}`));
      return frame;
    }
    function templateHeader(root,slide){
      let [prefix,topic]=headings[slide.section]||['',slide.kicker||slide.section];
      if(slide.section==='experiment'){
        if(slide.template_layout==='experiment-overview'){prefix='实验与分析：';topic='实验设计'}
        else{prefix='';topic=slide.title}
      }
      const header=el('div','template-header');
      if(prefix)header.append(el('span','template-prefix',prefix));
      header.append(el('span','template-topic',topic));
      root.append(header);
    }
    function renderProblem(root,slide){
      const scenes=el('div','problem-scenes');visible(slide.images).slice(0,2).forEach(item=>scenes.append(mediaItem(item)));root.append(scenes);
      const bottom=el('div','problem-bottom');const copy=el('div','copy');if(slide.summary)copy.append(el('div','summary',slide.summary));copy.append(bulletList(slide.bullets||[]));bottom.append(copy);bottom.append(el('div','template-conclusion',slide.title));root.append(bottom);
    }
    function renderResearch(root,slide){if(slide.summary)root.append(el('div','template-thesis',slide.summary));const grid=el('div','research-grid');visible(slide.images).forEach(item=>grid.append(mediaItem(item)));root.append(grid)}
    function renderCurrentState(root,slide){
      if(slide.summary)root.append(el('div','template-thesis',slide.summary));const grid=el('div','current-state-grid');const images=visible(slide.images);(spec.existing_solutions||[]).slice(0,3).forEach((item,index)=>{const card=el('article','current-solution');card.append(mediaItem(images[index]));card.append(el('h3','',item.name));if(item.solution)card.append(el('p','',item.solution));card.append(el('p','',`优点：${item.strength}`));const limitation=el('p');limitation.append(el('b','','不足：'));limitation.append(document.createTextNode(item.limitation));card.append(limitation);grid.append(card)});root.append(grid);root.append(el('div','template-conclusion',slide.title));
    }
    function renderGoal(root,slide){
      const statement=el('div','goal-statement');statement.append(el('span','','核心目标：'));statement.append(el('strong','',slide.goal_statement||slide.title||spec.meta.core_problem));root.append(statement);const pairs=(slide.goal_pairs||[]).slice(0,4);const layout=el('div','goal-layout');const left=el('section','goal-panel goal-focus');left.append(el('h3','goal-panel-title','解决'));const problems=el('div','goal-items');problems.style.setProperty('--pair-count',Math.max(pairs.length,1));pairs.forEach(item=>problems.append(el('div','goal-item',item.problem)));left.append(problems);layout.append(left);const right=el('section','goal-panel goal-functions');right.append(el('h3','goal-panel-title','关键功能'));const functions=el('div','goal-items');functions.style.setProperty('--pair-count',Math.max(pairs.length,1));pairs.forEach(item=>functions.append(el('div','goal-item',item.function)));right.append(functions);layout.append(right);root.append(layout);
    }
    function renderPrinciple(root,slide){
      if(slide.title)root.append(el('div','template-thesis',slide.title));const layout=el('div','principle-layout');const copy=el('div','copy');if(slide.summary)copy.append(el('div','summary',slide.summary));copy.append(bulletList(slide.bullets||[]));layout.append(copy);const media=el('div','principle-media');visible(slide.images).forEach(item=>media.append(mediaItem(item)));layout.append(media);root.append(layout);
    }
    function renderSolution(root,slide){
      root.append(el('div','template-thesis',slide.title));const byRole=new Map(visible(slide.images).map(item=>[item.role,item]));const layout=el('div','solution-layout');const concept=el('div','solution-concept');concept.append(mediaItem(byRole.get('concept-diagram')));layout.append(concept);const side=el('div','solution-side');side.append(mediaItem(byRole.get('hardware-diagram')));side.append(mediaItem(byRole.get('flow-diagram')));layout.append(side);root.append(layout);
    }
    function renderMaking(root,slide){
      if(slide.title)root.append(el('div','template-thesis',slide.title));const items=visible(slide.images);const grid=el('div',`making-grid ${items.length===1&&items[0].status==='missing'?'missing-only':''}`);items.forEach(item=>grid.append(mediaItem(item)));root.append(grid);
    }
    function renderPrototype(root,slide){
      if(slide.title)root.append(el('div','template-thesis',slide.title));const video=visible(slide.videos).find(item=>item.status==='present');const image=visible(slide.images).find(item=>item.status==='present')||visible(slide.images)[0];const hero=el('div','prototype-hero');hero.append(video?mediaItem(video,'video'):mediaItem(image));root.append(hero);
    }
    function renderExperiment(root,slide){
      if(slide.template_layout==='experiment-overview'){const box=el('div','experiment-overview');if(slide.summary)box.append(el('div','summary',slide.summary));box.append(bulletList(slide.bullets||[]));root.append(box);return}
      const meta=el('div','experiment-meta');const purpose=el('div');purpose.append(el('strong','','实验目的'));purpose.append(document.createTextNode(slide.experiment_purpose||''));meta.append(purpose);const method=el('div');method.append(el('strong','','实验方法'));method.append(document.createTextNode(slide.experiment_method||''));meta.append(method);root.append(meta);const byRole=new Map(visible(slide.images).map(item=>[item.role,item]));const media=el('div','experiment-media');media.append(mediaItem(byRole.get('experiment-process')));media.append(mediaItem(byRole.get('experiment-data')));root.append(media);root.append(el('div','experiment-result',`结论：${slide.experiment_conclusion||''}`));
    }
    function renderSummary(root,slide){
      root.append(el('div','template-thesis',slide.summary||slide.title));const values=slide.bullets||[];const futureIndex=values.findIndex(value=>/下一步|未来|限制|改进|优化/.test(value));const future=futureIndex>=0?values[futureIndex]:'待继续完善和验证';const points=values.filter((_,index)=>index!==futureIndex).slice(0,4);const layout=el('div','summary-layout');const evidence=el('div','summary-evidence');evidence.append(mediaItem(visible(slide.images)[0]));layout.append(evidence);const details=el('div','summary-details');const innovation=el('section','summary-block');innovation.append(el('h3','','创新点'));innovation.append(bulletList(points));details.append(innovation);const next=el('section','summary-block future');next.append(el('h3','','重难点 / 未来展望'));next.append(bulletList([future]));details.append(next);layout.append(details);root.append(layout);
    }
    function renderGeneric(root,slide){
      const layout=el('div','generic-content');const copy=el('div','copy');if(slide.summary)copy.append(el('div','summary',slide.summary));copy.append(bulletList(slide.bullets||[]));layout.append(copy);const media=el('div','generic-media');visible(slide.images).forEach(item=>media.append(mediaItem(item)));layout.append(media);root.append(layout);
    }
    function render(slide,index){
      const root=el('section',`slide ${slide.section}`);root.dataset.page=`${index+1} / ${spec.slides.length}`;root.dataset.notes=[slide.notes,slide.transition?`过渡：${slide.transition}`:''].filter(Boolean).join('\n\n');
      if(slide.section==='cover'){
        root.classList.add('cover');const image=visible(slide.images).find(item=>item.status!=='missing');if(image){const background=el('img','cover-bg');background.src=image.src;background.alt=image.label||'';root.append(background)}root.append(el('div','cover-shade'));const copy=el('div','cover-copy');copy.append(el('div','eyebrow','项目答辩'));copy.append(el('h1','',slide.title));const summaryHasStudent=(slide.summary||'').includes(spec.meta.student_name);if(slide.summary&&!summaryHasStudent)copy.append(el('div','subtitle',slide.summary));copy.append(el('div','student',summaryHasStudent?slide.summary:`${spec.meta.student_name}｜${spec.meta.project_short_name}`));root.append(copy);return root;
      }
      templateHeader(root,slide);
      if(slide.section==='problem')renderProblem(root,slide);else if(slide.section==='research')renderResearch(root,slide);else if(slide.section==='current-state')renderCurrentState(root,slide);else if(slide.section==='goal')renderGoal(root,slide);else if(slide.section==='principle')renderPrinciple(root,slide);else if(['solution','diagrams'].includes(slide.section))renderSolution(root,slide);else if(slide.section==='making')renderMaking(root,slide);else if(slide.section==='prototype')renderPrototype(root,slide);else if(slide.section==='experiment')renderExperiment(root,slide);else if(slide.section==='summary')renderSummary(root,slide);else renderGeneric(root,slide);
      return root;
    }
    spec.slides.forEach((slide,index)=>stage.append(render(slide,index)));
    const slides=[...stage.querySelectorAll('.slide')];
    function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(viewport.clientWidth/1600,viewport.clientHeight/900)})`}
    function go(index){current=Math.max(0,Math.min(index,slides.length-1));slides.forEach((slide,i)=>slide.classList.toggle('active',i===current));document.getElementById('progress').style.width=`${((current+1)/slides.length)*100}%`;document.getElementById('notes-title').textContent=`第${current+1}页｜${spec.slides[current].title}`;document.getElementById('notes-body').textContent=spec.slides[current].notes||''}
    document.getElementById('label').textContent=`${spec.meta.student_name}-${spec.meta.project_short_name}`;document.title=`${spec.meta.student_name}-${spec.meta.project_short_name}-答辩演示`;document.getElementById('notes-button').onclick=()=>panel.classList.toggle('open');document.getElementById('fullscreen-button').onclick=()=>document.documentElement.requestFullscreen?.();window.addEventListener('resize',fit);window.addEventListener('keydown',event=>{if(event.target instanceof HTMLMediaElement)return;if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();go(current-1)}else if(event.key.toLowerCase()==='n')panel.classList.toggle('open');else if(event.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});fit();go(0);window.__defenseReady=true;
  })();
  </script>
</body>
</html>
